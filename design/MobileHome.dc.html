<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; font-family: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif; color: #16161A; }
    a { color: #16161A; text-decoration: none; }
    a:hover { color: #55555C; }
    .tz-h { font-family: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif; font-weight: 500; letter-spacing: -.01em; }
    .tz-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</helmet>
<div dir="rtl" lang="ar" style="width: 390px; height: 844px; background: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #F0EEEB;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16161A" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h11"/></svg>
      <div class="tz-h" style="font-size: 21px;">طِراز</div>
    </div>
    <div style="display: flex; align-items: center; gap: 18px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16161A" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <div onClick="{{ addCart }}" style="position: relative; cursor: pointer;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16161A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16l-1.4 10.4a2 2 0 01-2 1.7H7.4a2 2 0 01-2-1.7z"/><path d="M9 6a3 3 0 016 0"/></svg>
        <div style="position: absolute; top: -5px; left: -6px; min-width: 16px; height: 16px; border-radius: 999px; background: {{accent}}; color: #fff; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px;">{{ cartLabel }}</div>
      </div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">

    <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #F0EEEB; overflow: hidden;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <div onClick="{{ c.pick }}" style="font-size: 12.5px; font-weight: 600; color: {{ c.fg }}; border-bottom: 2px solid {{ c.line }}; height: 100%; display: flex; align-items: center; white-space: nowrap; cursor: pointer;">{{ c.label }}</div>
      </sc-for>
    </div>

    <div style="position: relative; height: 300px; flex-shrink: 0; background: #E8E2D9; overflow: hidden;">
      <sc-if value="{{ s0 }}" hint-placeholder-val="{{ true }}">
        <img src="hero-motion.webp" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;" alt="">
        <div style="position: absolute; top: 46px; right: 16px; display: flex; align-items: center; gap: 6px; background: rgba(15,15,18,.55); color: #fff; border-radius: 999px; padding: 5px 11px; font-size: 10.5px; font-weight: 600;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"/></svg><span>فيديو</span>
        </div>
      </sc-if>
      <sc-if value="{{ s1 }}" hint-placeholder-val="{{ false }}"><img src="hero-abaya.jpg" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;" alt=""></sc-if>
      <sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}"><img src="hero-accessories.jpg" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;" alt=""></sc-if>
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(15,15,18,.72), rgba(15,15,18,.05) 62%);"></div>
      <div style="position: absolute; right: 20px; left: 20px; bottom: 22px; display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 10.5px; letter-spacing: .16em; font-weight: 600; color: rgba(255,255,255,.72);">{{ slide.eyebrow }}</div>
        <div class="tz-h" style="font-size: 27px; color: #fff; line-height: 1.25; white-space: pre-line;">{{ slide.title }}</div>
        <div style="background: #fff; color: #16161A; padding: 12px 0; border-radius: 8px; font-size: 14px; font-weight: 700; text-align: center; margin-top: 4px;">{{ slide.cta }}</div>
      </div>
      <div style="position: absolute; top: 14px; right: 20px; display: flex; gap: 6px;">
        <sc-for list="{{ slides }}" as="s" hint-placeholder-count="3">
          <div onClick="{{ s.go }}" style="width: {{ s.w }}; height: 3px; border-radius: 2px; background: {{ s.color }}; cursor: pointer; transition: all .3s;"></div>
        </sc-for>
      </div>
    </div>

    <div style="padding: 18px 16px 14px; flex-shrink: 0; display: flex; gap: 14px; overflow: hidden;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;">
        <div style="width: 62px; height: 62px; border-radius: 999px; overflow: hidden;"><img src="cat-abayas.jpg" class="tz-img" alt=""></div>
        <div style="font-size: 11.5px; font-weight: 600; white-space: nowrap;">عبايات</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;">
        <div style="width: 62px; height: 62px; border-radius: 999px; overflow: hidden;"><img src="cat-dresses.jpg" class="tz-img" alt=""></div>
        <div style="font-size: 11.5px; font-weight: 600; white-space: nowrap;">فساتين</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;">
        <div style="width: 62px; height: 62px; border-radius: 999px; overflow: hidden;"><img src="cat-basics.jpg" class="tz-img" alt=""></div>
        <div style="font-size: 11.5px; font-weight: 600; white-space: nowrap;">أساسيات</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;">
        <div style="width: 62px; height: 62px; border-radius: 999px; overflow: hidden;"><img src="cat-accessories.jpg" class="tz-img" alt=""></div>
        <div style="font-size: 11.5px; font-weight: 600; white-space: nowrap;">إكسسوارات</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;">
        <div style="width: 62px; height: 62px; border-radius: 999px; overflow: hidden;"><img src="cat-shoes.jpg" class="tz-img" alt=""></div>
        <div style="font-size: 11.5px; font-weight: 600; white-space: nowrap;">أحذية</div>
      </div>
    </div>

    <div style="padding: 6px 16px 0; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between;">
      <div class="tz-h" style="font-size: 19px;">وصل حديثاً</div>
      <div style="font-size: 12.5px; font-weight: 600; color: #55555C;">عرض الكل</div>
    </div>

    <div style="padding: 14px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; overflow: hidden;">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="position: relative; aspect-ratio: 4/5; border-radius: 10px; overflow: hidden; background: #EFEDEA;">
          <img src="p-abaya-linen.jpg" class="tz-img" alt="">
          <div style="position: absolute; top: 9px; right: 9px; background: #C0261E; color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 10px; font-weight: 700;">خصم ٣٠٪</div>
          <div onClick="{{ w0.toggle }}" style="position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,.94); display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="{{ w0.fill }}" stroke="{{ w0.stroke }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 12.9l-7.5 7.2a1.3 1.3 0 01-1.8 0l-7.5-7.2a4.6 4.6 0 016.5-6.5l.9.9.9-.9a4.6 4.6 0 016.5 6.5z"/></svg>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 13px; font-weight: 600; line-height: 1.5;">عباية كلوش كتان</div>
          <div style="display: flex; align-items: center; gap: 7px;">
            <div style="font-size: 14px; font-weight: 700; color: #C0261E;">٢٤٥ ر.س</div>
            <div style="font-size: 12px; color: #8A8A93; text-decoration: line-through;">٣٥٠ ر.س</div>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="position: relative; aspect-ratio: 4/5; border-radius: 10px; overflow: hidden; background: #EFEDEA;">
          <img src="p-shirt-white.jpg" class="tz-img" alt="">
          <div style="position: absolute; top: 9px; right: 9px; background: #16161A; color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 10px; font-weight: 700;">جديد</div>
          <div onClick="{{ w1.toggle }}" style="position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,.94); display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="{{ w1.fill }}" stroke="{{ w1.stroke }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 12.9l-7.5 7.2a1.3 1.3 0 01-1.8 0l-7.5-7.2a4.6 4.6 0 016.5-6.5l.9.9.9-.9a4.6 4.6 0 016.5 6.5z"/></svg>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 13px; font-weight: 600; line-height: 1.5;">قميص أوفر سايز</div>
          <div style="font-size: 14px; font-weight: 700;">١٨٩ ر.س</div>
        </div>
      </div>
    </div>

  </div>

  <div style="height: 66px; flex-shrink: 0; border-top: 1px solid #E6E4E0; background: rgba(255,255,255,.98); display: grid; grid-template-columns: repeat(4, 1fr);">
    <div onClick="{{ n0.pick }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; min-height: 44px; color: {{ n0.color }};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5L12 4l8.5 6.5V19a1.5 1.5 0 01-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 013.5 19z"/></svg>
      <div style="font-size: 10.5px; font-weight: 600;">الرئيسية</div>
    </div>
    <div onClick="{{ n1.pick }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; min-height: 44px; color: {{ n1.color }};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
      <div style="font-size: 10.5px; font-weight: 600;">الأقسام</div>
    </div>
    <div onClick="{{ n2.pick }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; min-height: 44px; color: {{ n2.color }};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 12.9l-7.5 7.2a1.3 1.3 0 01-1.8 0l-7.5-7.2a4.6 4.6 0 016.5-6.5l.9.9.9-.9a4.6 4.6 0 016.5 6.5z"/></svg>
      <div style="font-size: 10.5px; font-weight: 600;">المفضلة</div>
    </div>
    <div onClick="{{ n3.pick }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; min-height: 44px; color: {{ n3.color }};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4S18.3 16.4 19.5 20"/></svg>
      <div style="font-size: 10.5px; font-weight: 600;">حسابي</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#16161A","options":["#16161A","#7A2E2A","#1F4E43","#3B3A6B"],"section":"الهوية"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slide: 0, chip: 0, tab: 0, cart: 2, wished: {} };
  }
  renderVals() {
    const accent = this.props.accent ?? '#16161A';
    const S = this.state;
    const ar = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    const SLIDES = [
      { eyebrow: 'صيف ٢٠٢٦', title: 'خفيف، فضفاض،\nمصنوع للحرّ', cta: 'تسوّقي المجموعة' },
      { eyebrow: 'عبايات', title: 'الأسود بتفاصيل\nمختلفة', cta: 'شاهدي العبايات' },
      { eyebrow: 'إكسسوارات', title: 'اللمسة التي\nتُكمل الإطلالة', cta: 'اكتشفي' },
    ];
    const CHIPS = ['جديدنا', 'عبايات', 'فساتين', 'أساسيات', 'تخفيضات'];
    const NAVL = ['الرئيسية', 'الأقسام', 'المفضلة', 'حسابي'];
    const wish = i => ({
      toggle: () => this.setState({ wished: { ...S.wished, [i]: !S.wished[i] } }),
      fill: S.wished[i] ? '#C0261E' : 'none',
      stroke: S.wished[i] ? '#C0261E' : '#16161A',
    });
    const nav = i => ({ pick: () => this.setState({ tab: i }), color: i === S.tab ? accent : '#A6A29C' });
    return {
      accent,
      cartLabel: ar(S.cart),
      addCart: () => this.setState({ cart: S.cart + 1 }),
      slide: SLIDES[S.slide],
      s0: S.slide === 0, s1: S.slide === 1, s2: S.slide === 2,
      slides: SLIDES.map((_, i) => ({
        go: () => this.setState({ slide: i }),
        w: i === S.slide ? '28px' : '12px',
        color: i === S.slide ? '#FFFFFF' : 'rgba(255,255,255,.45)',
      })),
      chips: CHIPS.map((label, i) => ({
        label, pick: () => this.setState({ chip: i }),
        fg: i === S.chip ? '#16161A' : '#8A8A93',
        line: i === S.chip ? '#16161A' : 'transparent',
      })),
      w0: wish(0), w1: wish(1),
      n0: nav(0), n1: nav(1), n2: nav(2), n3: nav(3),
      navLabels: NAVL,
    };
  }
}
</script>
</body>
</html>
